<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Reseva</title>
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #9be79b, #3cc03c);
            color: #004d00;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #e6ffe6;
            border: 2px solid #3cc03c;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0px 10px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 20px;
        }

        #calendario {
            margin: 0px 0;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .form-group {
            margin-top: 30px;
            margin-bottom: 20px;
            width: 100%;
        }

        label {
            font-size: 1rem;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #3cc03c;
            border-radius: 6px;
            background: #f0fff0;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 1.2rem;
            color: white;
            background: #3cc03c;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            margin-top: 20px;
        }

        button:hover {
            background: #28a028;
            transform: translateY(-3px);
        }

        .back-link {
            margin-top: 25px;
            display: inline-block;
            font-size: 1rem;
            text-decoration: none;
            color: #3cc03c;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #28a028;
        }

        .error-message {
            color: red;
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<div class="container">
    <h1>Editar Reserva</h1>
    <p><strong>Reserva ID:</strong> {{ reserva.id }}</p>
    <p><strong>Usuario:</strong> {{ reserva.usuario.username }}</p>

    <form method="post">
        {% csrf_token %}
        <div>
            {{ form.as_p }}
        </div>
        <button type="submit">Guardar Cambios</button>
    </form>
    <a href="{% url 'perfil_usuario' %}" class="btn btn-secondary">Volver</a>
</div>
</html>
