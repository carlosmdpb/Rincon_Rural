<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #56ab2f, #a8e063); /* Fondo verde con degradado */
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }
        a {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            font-size: 1rem;
            color: white;
            text-decoration: none;
            background: #2b7a78;
            border-radius: 5px;
            transition: background 0.3s;
        }
        a:hover {
            background: #17252a;
        }
    </style>
</head>
<body>
    <h1>¡Bienvenido al sistema de gestión de reservas rurales! 🎉</h1>
    <p>Selecciona a dónde deseas acceder:</p>
    <a href="/admin">Acceso Administrador</a>
    <a href="/usuario">Acceso Usuario</a>
</body>
</html>
