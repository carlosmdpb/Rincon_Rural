<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d); /* Fondo profesional */
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Formas geométricas */
        .shape-rectangle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            transform: skewX(-15deg);
        }

        .shape-rectangle:nth-child(1) {
            top: 10%;
            left: -5%;
            width: 200px;
            height: 600px;
        }

        .shape-rectangle:nth-child(2) {
            top: 20%;
            right: -5%;
            width: 300px;
            height: 500px;
        }

        .shape-rectangle:nth-child(3) {
            top: 60%;
            left: 15%;
            width: 400px;
            height: 300px;
        }

        .shape-rectangle:nth-child(4) {
            bottom: 5%;
            right: 20%;
            width: 250px;
            height: 400px;
        }

        .logo {
            margin-bottom: 20px;
            z-index: 2;
        }

        .logo img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.3);
            background: white;
            padding: 10px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: white;
            z-index: 2;
        }

        p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #eaeaea;
            z-index: 2;
        }

        .buttons {
            display: flex;
            gap: 20px;
            z-index: 2;
        }

        a {
            padding: 15px 30px;
            font-size: 1.2rem;
            color: white;
            text-decoration: none;
            background: linear-gradient(to right, #43cea2, #185a9d);
            border-radius: 8px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        a:hover {
            transform: translateY(-5px);
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.5);
        }

        .calificacion {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            font-size: 1rem;
            color: white;
            z-index: 2;
        }

        .calificacion .numero {
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Formas geométricas para el fondo -->
    <div class="shape-rectangle"></div>
    <div class="shape-rectangle"></div>
    <div class="shape-rectangle"></div>
    <div class="shape-rectangle"></div>

    <div class="calificacion">
        <div class="numero">{{ promedio|floatformat:1 }} / 5</div>
        <div>Valoración</div>
    </div>

    <div class="logo">
        {% load static %}
        <img src="{% static 'images/36450.png' %}" alt="Logo del Sistema de Gestión Rural">
    </div>

    <h1>¡Bienvenido al Sistema de Gestión Rural!</h1>
    <p>Inicie sesión para continuar:</p>
    <div class="buttons">
        <a href="{% url 'login' %}">Iniciar Sesión</a>
        <a href="{% url 'registro' %}">Registrarse</a>
    </div>
</body>
</html>
