<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Espacio</title>
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #9be79b, #3cc03c);
            color: #004d00;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #e6ffe6;
            border: 2px solid #3cc03c;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0px 10px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 20px;
        }

        #calendario {
            margin: 0px 0;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .form-group {
            margin-top: 30px;
            margin-bottom: 20px;
            width: 100%;
        }

        label {
            font-size: 1rem;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #3cc03c;
            border-radius: 6px;
            background: #f0fff0;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 1.2rem;
            color: white;
            background: #3cc03c;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            margin-top: 20px;
        }

        button:hover {
            background: #28a028;
            transform: translateY(-3px);
        }

        .back-link {
            margin-top: 25px;
            display: inline-block;
            font-size: 1rem;
            text-decoration: none;
            color: #3cc03c;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #28a028;
        }

        .error-message {
            color: red;
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reservar Espacio</h1>
        <p>Espacio seleccionado: <strong>{{ espacio.nombre }}</strong></p>
        <div id="calendario"></div>

        <form method="post" id="reserva-form">
            {% csrf_token %}
            <!-- Campo oculto para enviar la fecha seleccionada -->
            <input type="hidden" id="fecha" name="fecha">

            <!-- Selector de duración -->
            <div class="form-group">
                <label for="duracion">¿Cuántas horas quieres reservar?</label>
                <select id="duracion" name="duracion" required disabled>
                    <option value="" selected>Seleccione la duración</option>
                    <option value="1">1 hora</option>
                    <option value="2">2 horas</option>
                    <option value="3">3 horas</option>
                    <option value="4">4 horas</option>
                    <option value="5">5 horas</option>
                    <option value="dia">Día entero</option>
                </select>
            </div>            

            <!-- Selector de franjas horarias -->
            <div class="form-group">
                <label for="franja-horaria">Selecciona una franja horaria</label>
                <select id="franja-horaria" name="franja_horaria" required disabled>
                    <option value="" selected>Seleccione una franja horaria</option>
                </select>
            </div>            

            <button type="submit">Confirmar Reserva</button>
        </form>

        <a href="{% url 'perfil_usuario' %}" class="back-link">Volver al Perfil</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const calendarioDiv = document.getElementById("calendario");
            const franjaHorariaSelect = document.getElementById("franja-horaria");
            const duracionSelect = document.getElementById("duracion");
            const fechaInput = document.getElementById("fecha");

            // Cargar días no disponibles
            fetch(`/reservas/dias-no-disponibles/{{ espacio.id }}/`)
                .then((response) => response.json())
                .then((data) => {
                    const diasNoDisponibles = data.dias_no_disponibles || [];
                    configurarCalendario(diasNoDisponibles);
                })
                .catch((error) => {
                    console.error("Error cargando días no disponibles:", error);
                    alert("No se pudieron cargar los días no disponibles. Inténtalo más tarde.");
                });

            function configurarCalendario(diasNoDisponibles) {
                flatpickr(calendarioDiv, {
                    inline: true,
                    dateFormat: "Y-m-d",
                    minDate: "today",
                    disable: diasNoDisponibles,
                    onChange: function (selectedDates, dateStr) {
                        fechaInput.value = dateStr; // Actualizar fecha seleccionada
                        duracionSelect.disabled = false; // Habilitar el selector de duración
                        franjaHorariaSelect.disabled = true; // Deshabilitar hasta que se seleccione duración
                    },
                });
            }

            // Cargar franjas horarias cuando se seleccione la duración
            duracionSelect.addEventListener("change", function () {
    const duracion = duracionSelect.value;
    const fechaSeleccionada = fechaInput.value;

    if (duracion && fechaSeleccionada) {
        if (duracion === "dia") {
            // Si se selecciona "día entero", cargar la franja completa
            cargarFranjaDiaEntero(fechaSeleccionada);
        } else {
            // Cargar las franjas normales basadas en la duración seleccionada
            cargarFranjasDisponibles(fechaSeleccionada, duracion);
        }
    }
});

function cargarFranjasDisponibles(fechaSeleccionada, duracion) {
    const espacioId = "{{ espacio.id }}";

    franjaHorariaSelect.disabled = true;
    franjaHorariaSelect.innerHTML = `<option value="">Cargando franjas...</option>`;

    fetch(`/reservas/horas-disponibles/${espacioId}/${fechaSeleccionada}/?duracion=${duracion}`)
        .then((response) => response.json())
        .then((data) => {
            if (data.franjas_disponibles && data.franjas_disponibles.length > 0) {
                franjaHorariaSelect.innerHTML = `<option value="">Seleccione una franja horaria</option>`;
                data.franjas_disponibles.forEach(([inicio, fin]) => {
                    const option = document.createElement("option");
                    option.value = `${inicio}-${fin}`;
                    option.textContent = `${inicio} - ${fin}`;
                    franjaHorariaSelect.appendChild(option);
                });
                franjaHorariaSelect.disabled = false;
            } else {
                franjaHorariaSelect.innerHTML = `<option value="">No hay franjas disponibles</option>`;
            }
        })
        .catch((error) => {
            console.error("Error cargando franjas horarias:", error);
            franjaHorariaSelect.innerHTML = `<option value="">Error al cargar</option>`;
        });
}

function cargarFranjaDiaEntero(fechaSeleccionada) {
    const espacioId = "{{ espacio.id }}";

    franjaHorariaSelect.disabled = true;
    franjaHorariaSelect.innerHTML = `<option value="">Cargando franjas...</option>`;

    fetch(`/reservas/horas-disponibles/${espacioId}/${fechaSeleccionada}/?duracion=dia`)
        .then((response) => response.json())
        .then((data) => {
            if (data.franjas_disponibles && data.franjas_disponibles.length > 0) {
                franjaHorariaSelect.innerHTML = `<option value="">Seleccione una franja horaria</option>`;
                data.franjas_disponibles.forEach(([inicio, fin]) => {
                    const option = document.createElement("option");
                    option.value = `${inicio}-${fin}`;
                    option.textContent = `${inicio} - ${fin}`;
                    franjaHorariaSelect.appendChild(option);
                });
                franjaHorariaSelect.disabled = false;
            } else {
                franjaHorariaSelect.innerHTML = `<option value="">No hay franjas disponibles</option>`;
            }
        })
        .catch((error) => {
            console.error("Error cargando franjas horarias:", error);
            franjaHorariaSelect.innerHTML = `<option value="">Error al cargar</option>`;
        });
        }
    });
    </script>
</body>
</html>
