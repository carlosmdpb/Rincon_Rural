<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Espacio</title>
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #43cea2, #185a9d); /* Fondo gradiente azul-verde */
            color: #2c3e50; /* Texto gris oscuro */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Formas geométricas */
        .shape-rectangle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            transform: skewX(-15deg);
        }

        .shape-rectangle:nth-child(1) {
            top: 10%;
            left: -5%;
            width: 200px;
            height: 600px;
        }

        .shape-rectangle:nth-child(2) {
            top: 20%;
            right: -5%;
            width: 300px;
            height: 500px;
        }

        .shape-rectangle:nth-child(3) {
            top: 60%;
            left: 15%;
            width: 400px;
            height: 300px;
        }

        .shape-rectangle:nth-child(4) {
            bottom: 5%;
            right: 20%;
            width: 250px;
            height: 400px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9); /* Fondo blanco con transparencia */
            border-radius: 20px;
            padding: 30px 40px;
            box-shadow: 0px 20px 30px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            animation: fadeIn 1s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #185a9d; /* Azul intenso */
        }

        p {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #34495e; /* Gris oscuro */
        }

        label {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
            text-align: center; /* Centrar texto de las etiquetas */
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #185a9d;
            border-radius: 6px;
            background: #e3f2fd; /* Azul claro */
            text-align: center; /* Centrar texto dentro del select */
            max-width: 300px; /* Limitar ancho para centrarlo visualmente */
            margin: 0 auto; /* Centrar el select */
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            font-size: 1.2rem;
            color: #fff;
            background: linear-gradient(to right, #43cea2, #185a9d); /* Botón degradado */
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            margin-top: 20px;
            text-align: center;
            display: block; /* Asegurar que el botón es un bloque para centrado */
            margin: 20px auto; /* Centrar el botón */
        }

        button:hover {
            background: linear-gradient(to right, #185a9d, #43cea2);
            transform: scale(1.05);
        }

        .back-link {
            margin-top: 25px;
            display: inline-block;
            font-size: 1rem;
            text-decoration: none;
            color: #185a9d;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #43cea2;
        }

        #calendario {
            margin: 0px 0;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .form-group {
            margin-top: 20px;
            margin-bottom: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centrar selects y etiquetas */
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center; /* Centrar el botón y los selects */
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Formas geométricas para el fondo -->
    <div class="shape-rectangle"></div>
    <div class="shape-rectangle"></div>
    <div class="shape-rectangle"></div>
    <div class="shape-rectangle"></div>

    <div class="container">
        <h1>Reservar Espacio</h1>
        <p>Espacio seleccionado: <strong>{{ espacio.nombre }}</strong></p>
        <div id="calendario"></div>

        <form method="post" id="reserva-form">
            {% csrf_token %}
            <!-- Campo oculto para enviar la fecha seleccionada -->
            <input type="hidden" id="fecha" name="fecha">

            <!-- Selector de duración -->
            <div class="form-group">
                <label for="duracion">¿Cuántas horas quieres reservar?</label>
                <select id="duracion" name="duracion" required disabled>
                    <option value="" selected>Seleccione la duración</option>
                    <option value="1">1 hora</option>
                    <option value="2">2 horas</option>
                    <option value="3">3 horas</option>
                    <option value="4">4 horas</option>
                    <option value="5">5 horas</option>
                    <option value="dia">Día entero</option>
                </select>
            </div>            

            <!-- Selector de franjas horarias -->
            <div class="form-group">
                <label for="franja-horaria">Selecciona una franja horaria</label>
                <select id="franja-horaria" name="franja_horaria" required disabled>
                    <option value="" selected>Seleccione una franja horaria</option>
                </select>
            </div>            

            <button type="submit">Confirmar Reserva</button>
        </form>

        <a href="{% url 'perfil_usuario' %}" class="back-link">Volver al Perfil</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const calendarioDiv = document.getElementById("calendario");
            const franjaHorariaSelect = document.getElementById("franja-horaria");
            const duracionSelect = document.getElementById("duracion");
            const fechaInput = document.getElementById("fecha");

            // Cargar días no disponibles
            fetch(`/reservas/dias-no-disponibles/{{ espacio.id }}/`)
                .then((response) => response.json())
                .then((data) => {
                    configurarCalendario(data.dias_no_disponibles || []);
                })
                .catch((error) => {
                    console.error("Error cargando días no disponibles:", error);
                    alert("No se pudieron cargar los días no disponibles. Inténtalo más tarde.");
                });

            function configurarCalendario(diasNoDisponibles) {
                flatpickr(calendarioDiv, {
                    inline: true,
                    dateFormat: "Y-m-d",
                    minDate: "today",
                    disable: diasNoDisponibles,
                    onChange: function (selectedDates, dateStr) {
                        fechaInput.value = dateStr; // Actualizar fecha seleccionada
                        duracionSelect.disabled = false; // Habilitar el selector de duración
                        franjaHorariaSelect.disabled = true; // Deshabilitar hasta que se seleccione duración
                    },
                });
            }

            duracionSelect.addEventListener("change", function () {
                const duracion = this.value;
                const fechaSeleccionada = fechaInput.value;

                if (duracion && fechaSeleccionada) {
                    cargarFranjasDisponibles(fechaSeleccionada, duracion);
                }
            });

            function cargarFranjasDisponibles(fechaSeleccionada, duracion) {
                franjaHorariaSelect.disabled = true;
                franjaHorariaSelect.innerHTML = `<option value="">Cargando franjas...</option>`;
                fetch(`/reservas/horas-disponibles/{{ espacio.id }}/${fechaSeleccionada}/?duracion=${duracion}`)
                    .then((response) => response.json())
                    .then((data) => {
                        franjaHorariaSelect.innerHTML = data.franjas_disponibles.length
                            ? `<option value="">Seleccione una franja horaria</option>`
                            : `<option value="">No hay franjas disponibles</option>`;
                        data.franjas_disponibles.forEach(([inicio, fin]) => {
                            franjaHorariaSelect.innerHTML += `<option value="${inicio}-${fin}">${inicio} - ${fin}</option>`;
                        });
                        franjaHorariaSelect.disabled = false;
                    });
            }
        });
    </script>
</body>
</html>
