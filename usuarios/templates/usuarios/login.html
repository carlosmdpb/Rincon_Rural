<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #9be79b, #3cc03c); /* Fondo verde suave */
            color: #004d00; /* Texto en verde oscuro */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #e6ffe6; /* Fondo verde claro */
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0px 10px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            text-align: center;
            border: 2px solid #3cc03c;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #004d00; /* Verde oscuro */
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        form input {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #3cc03c; /* Borde verde */
            outline: none;
            font-size: 1rem;
            width: 100%;
            max-width: 300px;
        }

        form button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1.2rem;
            color: white;
            background: #3cc03c; /* Botón verde brillante */
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        form button:hover {
            background: #28a028; /* Hover verde más oscuro */
            transform: translateY(-3px);
        }

        .register-link {
            margin-top: 20px;
            font-size: 1rem;
            text-decoration: none;
            color: #3cc03c;
            transition: color 0.3s ease;
        }

        .register-link:hover {
            color: #28a028; /* Hover más oscuro */
        }

        .logo img {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            {% load static %}
            <img src="{% static 'images/logo_without_text.png' %}" alt="Logo del Sistema de Gestión Rural">
        </div>
        <h1>Iniciar Sesión</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Iniciar Sesión</button>
        </form>
        <a href="{% url 'registro' %}" class="register-link">¿No tienes cuenta? Regístrate aquí</a>
    </div>
</body>
</html>
