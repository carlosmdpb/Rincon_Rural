<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #43cea2, #185a9d); /* Fondo gradiente azul-verde */
            color: #2c3e50; /* Texto gris oscuro */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9); /* Fondo blanco con transparencia */
            border-radius: 20px;
            padding: 30px 40px;
            box-shadow: 0px 20px 30px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 2px solid #43cea2;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #185a9d; /* Azul intenso */
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        form input {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #185a9d; /* Borde azul */
            outline: none;
            font-size: 1rem;
            width: calc(100% - 20px);
            background: #e3f2fd; /* Fondo azul claro */
        }

        form button {
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            font-size: 1.2rem;
            color: #fff;
            background: linear-gradient(to right, #43cea2, #185a9d); /* Botón degradado */
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            width: 100%;
            max-width: 300px;
            margin-top: 10px;
        }

        form button:hover {
            background: linear-gradient(to right, #185a9d, #43cea2);
            transform: scale(1.05);
        }

        .register-link {
            margin-top: 20px;
            font-size: 1rem;
            text-decoration: none;
            color: #185a9d;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .register-link:hover {
            color: #43cea2; /* Hover más claro */
        }

        .logo {
    position: relative; /* Permite posicionar el logo sobre el contenedor */
    top: -40px; /* Eleva el logo hacia arriba */
    margin-bottom: -20px; /* Ajusta el margen inferior */
}

.logo img {
    width: 120px; /* Incrementar tamaño del logo */
    height: 120px; /* Ajustar altura */
    display: block; /* Asegura que esté centrado */
    margin: 0 auto;
    box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2); /* Mantener la sombra */
    border-radius: 50%; /* Si la imagen lo requiere */
    background: white; /* Fondo blanco para integrarlo con el contenedor */
    padding: 10px; /* Espaciado para dar un efecto limpio */
}


        .messages {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            text-align: left;
            background-color: #fdfd96; /* Fondo amarillo para mensajes */
            color: #4d4d00; /* Texto oscuro */
        }

        .messages li {
            list-style-type: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            {% load static %}
            <img src="{% static 'images/36450.png' %}" alt="Logo del Sistema de Gestión Rural">
        </div>
        <h1>Iniciar Sesión</h1>

        <!-- Bloque para mostrar mensajes -->
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div>
                <label for="id_username">Nombre de Usuario</label>
                <input type="text" name="username" id="id_username">
            </div>
            <div>
                <label for="id_password">Contraseña</label>
                <input type="password" name="password" id="id_password">
            </div>
            <button type="submit">Iniciar Sesión</button>
        </form>
        
        <a href="{% url 'registro' %}" class="register-link">¿No tienes cuenta? Regístrate aquí</a>
    </div>
</body>
</html>
