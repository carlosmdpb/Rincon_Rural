<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Administrador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #004d00, #1a7c1a, #3cc03c);
            color: #f2f2f2;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #2b5f2b;
            border: 2px solid #1a471a;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0px 10px 15px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #fdfd96;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        form input {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #3cc03c;
            outline: none;
            font-size: 1rem;
            width: 100%;
            max-width: 300px;
            background: #f0fff0;
        }

        form button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1.2rem;
            color: white;
            background: #3cc03c;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        form button:hover {
            background: #28a028;
            transform: translateY(-3px);
        }

        .messages {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            text-align: left;
            background-color: #fdfd96;
            color: #4d4d00;
        }

        .messages li {
            list-style-type: none;
        }

        .logo img {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.3);
        }

        .register-link {
            margin-top: 20px;
            font-size: 1rem;
            text-decoration: none;
            color: #fdfd96;
            transition: color 0.3s ease;
        }

        .register-link:hover {
            color: #ffe75e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            {% load static %}
            <img src="{% static 'images/logo_admin.png' %}" alt="Logo del Administrador">
        </div>
        <h1>Iniciar Sesión - Administrador</h1>

        <!-- Bloque para mostrar mensajes -->
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Iniciar Sesión</button>
        </form>
        <a href="{% url 'bienvenido' %}" class="register-link">Volver a la página principal</a>
    </div>
</body>
</html>
