<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorar Aplicación</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .emoji-rating {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .emoji-rating button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 40px;
            transition: transform 0.2s;
        }
        .emoji-rating button:hover {
            transform: scale(1.2);
        }
        .emoji-rating button:focus {
            outline: none;
        }
        button.submit {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        button.submit:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Valora Nuestra Aplicación</h2>
        <p>¿Qué tan fácil te ha resultado utilizar nuestra aplicación?</p>

        <!-- Mensajes de error o éxito -->
        {% if messages %}
            {% for message in messages %}
                <div class="{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <!-- Formulario de valoración -->
        <form method="post">
            {% csrf_token %}
            <div class="emoji-rating">
                <button type="submit" name="puntuacion" value="1" aria-label="Muy difícil">😠</button>
                <button type="submit" name="puntuacion" value="2" aria-label="Difícil">😟</button>
                <button type="submit" name="puntuacion" value="3" aria-label="Neutral">😐</button>
                <button type="submit" name="puntuacion" value="4" aria-label="Fácil">😊</button>
                <button type="submit" name="puntuacion" value="5" aria-label="Muy fácil">😍</button>
            </div>
            <button type="submit" class="submit">Enviar Valoración</button>
        </form>
    </div>
</body>
</html>
