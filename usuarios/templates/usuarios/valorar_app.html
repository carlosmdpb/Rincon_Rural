<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorar Aplicación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #43cea2, #185a9d); /* Fondo gradiente azul-verde */
            color: #2c3e50; /* Texto gris oscuro */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9); /* Fondo blanco con transparencia */
            border-radius: 20px;
            padding: 30px 40px;
            box-shadow: 0px 20px 30px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #185a9d; /* Azul intenso */
        }

        p {
            font-size: 1.2rem;
            color: #34495e; /* Gris oscuro */
            margin-bottom: 20px;
        }

        .emoji-rating {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .emoji-rating button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 40px;
            transition: transform 0.2s;
        }

        .emoji-rating button:hover {
            transform: scale(1.2);
        }

        .emoji-rating button:focus {
            outline: none;
        }

        button.submit {
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            font-size: 1.2rem;
            color: #fff;
            background: linear-gradient(to right, #43cea2, #185a9d); /* Botón degradado */
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            display: block;
            margin: 20px auto;
            width: 100%;
        }

        button.submit:hover {
            background: linear-gradient(to right, #185a9d, #43cea2);
            transform: scale(1.05);
        }

        /* Mensajes */
        .messages {
            margin-bottom: 20px;
            font-size: 1rem;
            color: #185a9d;
        }

        .messages.success {
            color: #28a745;
        }

        .messages.error {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Valora Nuestra Aplicación</h2>
        <p>¿Qué tan fácil te ha resultado utilizar nuestra aplicación?</p>

        <!-- Mensajes de error o éxito -->
        {% if messages %}
            {% for message in messages %}
                <div class="messages {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <!-- Formulario de valoración -->
        <form method="post">
            {% csrf_token %}
            <div class="emoji-rating">
                <button type="submit" name="puntuacion" value="1" aria-label="Muy difícil">😠</button>
                <button type="submit" name="puntuacion" value="2" aria-label="Difícil">😟</button>
                <button type="submit" name="puntuacion" value="3" aria-label="Neutral">😐</button>
                <button type="submit" name="puntuacion" value="4" aria-label="Fácil">😊</button>
                <button type="submit" name="puntuacion" value="5" aria-label="Muy fácil">😍</button>
            </div>
            <button type="submit" class="submit">Enviar Valoración</button>
        </form>
    </div>
</body>
</html>
